<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B0F19" />
<title>Officina · Informatix Repair</title>
<link rel="icon" href="data:," />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink:'#0B0F19', primary:'#111827', secondary:{DEFAULT:'#DC2626',dark:'#B91C1C',light:'#FEE2E2'}, lightbg:'#F5F6F8', line:'#E5E7EB' },
    fontFamily: { heading:['Poppins','system-ui','sans-serif'], body:['Inter','system-ui','sans-serif'] },
  } } };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --red:#DC2626; --red-d:#B91C1C; --ink:#0B0F19; --line:#E5E7EB; --bg:#F5F6F8; --muted:#6B7280; }
  *{-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  h1,h2,h3,.font-heading{font-family:'Poppins',system-ui,sans-serif;letter-spacing:-.01em}
  h1{line-height:1.2}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}

  /* ---------- componenti ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:1rem}
  .btn{font-weight:600;border-radius:.75rem;padding:.55rem 1rem;min-height:2.5rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;transition:background .15s,transform .1s,border-color .15s;white-space:nowrap;font-size:.875rem;cursor:pointer;text-decoration:none;line-height:1.2}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--red);color:#fff} .btn-primary:hover{background:var(--red-d)}
  .btn-dark{background:var(--ink);color:#fff} .btn-dark:hover{background:#1F2937}
  .btn-green{background:#059669;color:#fff} .btn-green:hover{background:#047857}
  .btn-outline{border:1px solid var(--line);background:#fff;color:#111827} .btn-outline:hover{background:var(--bg);border-color:#D1D5DB}
  .btn-ghost{color:var(--muted)} .btn-ghost:hover{color:#111827;background:var(--bg)}
  .btn-sm{padding:.3rem .7rem;min-height:2.1rem;font-size:.78rem;border-radius:.6rem}
  .btn-lg{padding:.85rem 1.4rem;font-size:1rem;border-radius:.9rem;min-height:3rem}
  input,select,textarea{border:1px solid var(--line);border-radius:.65rem;padding:.55rem .75rem;width:100%;font-size:.9rem;background:#fff;color:#111827;transition:border-color .15s,box-shadow .15s;min-height:2.5rem}
  input::placeholder,textarea::placeholder{color:#9CA3AF}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgb(220 38 38/.12)}
  input[type=checkbox]{min-height:0;width:1.1rem;height:1.1rem;accent-color:var(--red)}
  input:disabled,select:disabled,textarea:disabled{background:var(--bg);color:#6B7280}
  label.l{font-size:.75rem;font-weight:600;color:#4B5563;margin-bottom:.3rem;display:block}
  .badge{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.15rem .6rem;font-size:.7rem;font-weight:700;white-space:nowrap;line-height:1.5}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.35rem .85rem;font-size:.8rem;font-weight:600;color:#4B5563;cursor:pointer;transition:.15s;user-select:none;line-height:1.3}
  .chip:hover{border-color:#D1D5DB;color:#111827}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip-red.on{background:#FEF2F2;color:var(--red-d);border-color:var(--red)}
  .chip small{opacity:.6;font-weight:700;margin-left:.25rem}
  .bar{height:7px;background:#EEF0F2;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .4s}
  .bar.green>i{background:#059669}
  .sec-t{font-size:.7rem;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.07em;margin:1.1rem 0 .5rem}
  .sec-t:first-child{margin-top:0}
  .row-h{transition:background .12s} .row-h:hover{background:#FAFAFB}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.t{width:100%;font-size:.85rem;min-width:34rem} table.t th{text-align:left;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:.55rem .75rem;border-bottom:1px solid var(--line);white-space:nowrap} table.t td{padding:.65rem .75rem;border-bottom:1px solid #F1F2F4;vertical-align:middle}
  table.t tr:last-child td{border-bottom:0}
  .empty{padding:2.5rem 1rem;text-align:center;color:#9CA3AF;font-size:.875rem}
  .kpi{padding:1rem;transition:box-shadow .15s} a.kpi:hover{box-shadow:0 6px 18px -8px rgb(16 24 40/.25)}
  .kpi b{display:block;font-family:Poppins,system-ui,sans-serif;font-weight:800;font-size:1.65rem;line-height:1.15}
  .kpi span{font-size:.75rem;color:var(--muted);font-weight:600}
  .truncate-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ---------- modali ---------- */
  .modal-bg{background:rgba(11,15,25,.62);backdrop-filter:blur(3px);animation:fade .15s}
  .modal-panel{display:flex;flex-direction:column;max-height:calc(100dvh - 1rem);animation:up .2s}
  .modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  @keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(14px);opacity:.6}}
  @media (min-width:640px){ .modal-panel{max-height:calc(100dvh - 3rem)} }
  @media (max-width:639px){ .modal-panel{min-height:55dvh} }

  /* ---------- layout ---------- */
  .nav a{display:flex;align-items:center;gap:.6rem;padding:.6rem .85rem;border-radius:.75rem;color:#9CA3AF;font-weight:600;font-size:.88rem;transition:.15s;text-decoration:none}
  .nav a:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav a.on{background:var(--red);color:#fff}
  .nav a .ico{width:1.4rem;text-align:center}
  #bottom-nav{display:none}
  #fab{display:none}
  @media (max-width:1023px){
    #side{display:none}
    #bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);padding:.35rem .35rem calc(.35rem + env(safe-area-inset-bottom));justify-content:space-around}
    #bottom-nav a,#bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.05rem;padding:.35rem .2rem;border-radius:.7rem;color:#9CA3AF;font-size:.65rem;font-weight:600;text-decoration:none;min-height:3rem;justify-content:center}
    #bottom-nav a.on{color:#fff;background:rgba(220,38,38,.9)}
    #bottom-nav .ico{font-size:1.25rem;line-height:1.1}
    #fab{display:flex;position:fixed;right:1rem;bottom:calc(4.6rem + env(safe-area-inset-bottom));z-index:29;width:3.5rem;height:3.5rem;border-radius:999px;background:var(--red);color:#fff;font-size:1.9rem;align-items:center;justify-content:center;box-shadow:0 10px 24px -6px rgb(220 38 38/.55);line-height:1}
    main{padding-bottom:9rem!important}
    body{font-size:15px}
    input,select,textarea{font-size:16px} /* evita lo zoom automatico su iPhone */
    .kpi b{font-size:1.4rem}
  }
  #toast{box-shadow:0 8px 24px -6px rgb(0 0 0/.35);max-width:92vw;text-align:center}
  #more-menu{position:fixed;right:.5rem;bottom:calc(4.2rem + env(safe-area-inset-bottom));z-index:40;min-width:13rem}
  .search-pop{max-height:min(70dvh,26rem);overflow-y:auto}
  kbd{font-family:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:.35rem;padding:0 .35rem;font-size:.7rem;background:#fff;color:var(--muted)}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="text-primary">
<div class="lg:flex min-h-screen">
  <aside id="side" class="bg-ink text-white w-60 sticky top-0 h-screen flex-col p-4 gap-6 shrink-0 flex">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-lg flex items-center justify-center font-heading font-bold" style="background:linear-gradient(135deg,#DC2626,#B91C1C)">IX</div>
      <div><p class="font-heading font-bold text-sm leading-tight">Officina</p><p class="text-[11px] text-gray-400 leading-tight">Informatix Repair</p></div>
    </div>
    <nav class="nav flex flex-col gap-1" id="nav"></nav>
    <p class="mt-auto text-[11px] text-gray-500 leading-relaxed">Solo locale · nessun login<br>Scorciatoie: <kbd>N</kbd> nuova riparazione, <kbd>/</kbd> cerca</p>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-line">
      <div class="max-w-6xl mx-auto w-full px-4 lg:px-8 py-2.5 flex items-center gap-3">
        <div class="lg:hidden w-9 h-9 rounded-lg flex items-center justify-center font-heading font-bold text-white text-sm shrink-0" style="background:linear-gradient(135deg,#DC2626,#B91C1C)">IX</div>
        <div class="relative flex-1 min-w-0">
          <input id="gsearch" type="search" placeholder="Cerca cliente, telefono, modello, codice…" autocomplete="off" />
          <div id="gsearch-res" class="hidden absolute left-0 right-0 mt-1 card shadow-xl search-pop z-30"></div>
        </div>
        <button id="top-new" class="btn btn-primary hidden lg:inline-flex">＋ Nuova riparazione</button>
      </div>
    </header>
    <main class="flex-1 p-4 lg:p-8 max-w-6xl w-full mx-auto" id="view"></main>
  </div>
</div>

<nav id="bottom-nav" aria-label="Navigazione"></nav>
<button id="fab" aria-label="Nuova riparazione">＋</button>
<div id="more-menu" class="hidden card shadow-2xl p-1.5"></div>
<div id="modal-root"></div>
<div id="toast" class="hidden fixed bottom-28 lg:bottom-6 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-white text-sm font-semibold"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
