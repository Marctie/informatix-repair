<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accedi · Gestionale Usati Informatix Repair</title>
<link rel="icon" href="data:,">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        ink: '#0B0F19', primary: '#111827',
        secondary: { DEFAULT: '#DC2626', dark: '#B91C1C', light: '#FEE2E2' },
        lightbg: '#F5F6F8', line: '#E5E7EB',
      },
      fontFamily: { heading: ['Poppins','system-ui','sans-serif'], body: ['Inter','system-ui','sans-serif'] },
      boxShadow: { lift: '0 2px 4px rgb(16 24 40 / .05), 0 20px 40px -12px rgb(16 24 40 / .20)' },
    } }
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter', system-ui, sans-serif; }
  h1,.font-heading{ font-family:'Poppins', system-ui, sans-serif; }
  .grid-pattern{ background-image:radial-gradient(circle, rgba(255,255,255,.08) 1px, transparent 1px); background-size:22px 22px; }
  input{ border:1px solid #E5E7EB; border-radius:.6rem; padding:.65rem .85rem; width:100%; font-size:.9rem; transition:.15s; }
  input:focus{ outline:none; border-color:#DC2626; box-shadow:0 0 0 3px rgb(220 38 38 / .12); }
  label{ font-size:.78rem; font-weight:600; color:#4B5563; margin-bottom:.35rem; display:block; }
  .btn-primary{ background:#DC2626; color:#fff; font-weight:600; border-radius:.7rem; padding:.7rem 1.1rem; width:100%; transition:.15s; }
  .btn-primary:hover{ background:#B91C1C; }
  .btn-primary:disabled{ opacity:.6; cursor:not-allowed; }
</style>
</head>
<body class="bg-ink min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  <div class="grid-pattern absolute inset-0" aria-hidden="true"></div>

  <div class="relative w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-xl mx-auto mb-3 flex items-center justify-center font-heading font-bold text-white" style="background:linear-gradient(135deg,#DC2626,#B91C1C)">IX</div>
      <h1 class="text-white font-bold text-lg">Gestionale Usati</h1>
      <p class="text-gray-400 text-sm">Informatix Repair</p>
    </div>

    <form id="login-form" class="bg-white rounded-2xl shadow-lift p-6 space-y-4">
      <div>
        <label for="username">Utente</label>
        <input id="username" name="username" autocomplete="username" required autofocus />
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <p id="error" class="hidden text-sm text-secondary font-medium">Utente o password non corretti.</p>
      <button type="submit" id="btn-submit" class="btn-primary">Accedi</button>
    </form>
    <p class="text-center text-gray-500 text-xs mt-5">Accessibile solo da questo PC &middot; localhost:4848</p>
  </div>

<script>
  const form = document.getElementById('login-form');
  const err = document.getElementById('error');
  const btn = document.getElementById('btn-submit');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Accesso…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('username').value.trim(), password: document.getElementById('password').value }),
      });
      const out = await res.json();
      if (!out.ok) throw new Error();
      location.href = '/';
    } catch {
      err.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Accedi';
    }
  });
</script>
</body>
</html>
