<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assistente · Gestionale Usati</title>
<link rel="icon" href="data:,">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Inter',system-ui,sans-serif; background:#F5F6F8; color:#111827; }
  h1,h2,.font-heading{ font-family:'Poppins',system-ui,sans-serif; }
  .btn-primary{ background:#DC2626; color:#fff; font-weight:600; border-radius:.7rem; padding:.6rem 1.15rem; display:inline-flex; align-items:center; justify-content:center; gap:.4rem; transition:.15s; white-space:nowrap; }
  .btn-primary:hover{ background:#B91C1C; } .btn-primary:disabled{ opacity:.6; cursor:not-allowed; }
  .btn-outline{ border:1px solid #E5E7EB; font-weight:600; border-radius:.7rem; padding:.55rem 1rem; background:#fff; transition:.15s; white-space:nowrap; }
  .btn-outline:hover{ background:#F5F6F8; }
  .btn-danger{ background:#7F1D1D; color:#fff; font-weight:600; border-radius:.7rem; padding:.6rem 1.15rem; }
  textarea,input{ border:1px solid #E5E7EB; border-radius:.7rem; padding:.6rem .8rem; width:100%; font-size:.92rem; background:#fff; }
  textarea:focus,input:focus{ outline:none; border-color:#DC2626; box-shadow:0 0 0 3px rgb(220 38 38 / .12); }
  .bubble-user{ background:#0B0F19; color:#fff; border-radius:1rem 1rem .25rem 1rem; }
  .bubble-bot{ background:#fff; border:1px solid #E5E7EB; border-radius:1rem 1rem 1rem .25rem; }
  .badge{ display:inline-flex; border-radius:999px; padding:.15rem .6rem; font-size:.7rem; font-weight:700; }
  .summary{ border:1px solid #E5E7EB; border-radius:.8rem; background:#FAFAFB; }
  .summary.danger{ border-color:#DC2626; background:#FEF2F2; }
  .summary.invalid{ background:#FFF7ED; border-color:#FDBA74; }
  .dots span{ display:inline-block; width:6px; height:6px; margin:0 2px; border-radius:50%; background:#9CA3AF; animation:b 1.2s infinite; }
  .dots span:nth-child(2){ animation-delay:.2s } .dots span:nth-child(3){ animation-delay:.4s }
  @keyframes b{ 0%,80%,100%{ transform:scale(.6); opacity:.5 } 40%{ transform:scale(1); opacity:1 } }
</style>
</head>
<body>
<header class="bg-[#0B0F19] text-white sticky top-0 z-30">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div>
      <p class="font-heading font-bold text-sm leading-tight">✨ Assistente Informatix</p>
      <p class="text-[11px] text-gray-400 leading-tight" id="status-line">Controllo LLM…</p>
    </div>
    <a href="/" class="text-sm text-gray-300 hover:text-white font-semibold">← Gestionale</a>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 pt-4 pb-44">
  <div class="flex items-center justify-between gap-2 mb-4">
    <select id="flt" class="!w-auto text-sm">
      <option value="all">Tutta la cronologia</option>
      <option value="executed">Solo operazioni eseguite</option>
      <option value="pending">In attesa / in coda</option>
      <option value="cancelled">Annullate</option>
    </select>
    <p class="text-xs text-gray-500" id="hist-note"></p>
  </div>
  <div id="feed" class="space-y-5"></div>
  <div id="empty" class="hidden text-center text-gray-500 py-16">
    <p class="font-heading font-semibold text-gray-900 mb-2">Come posso aiutarti?</p>
    <p class="text-sm mb-4">Scrivi come parleresti a un collega. Prima di ogni modifica ti mostro un riepilogo da confermare.</p>
    <div class="flex flex-wrap justify-center gap-2" id="examples"></div>
  </div>
</main>

<div class="fixed bottom-0 inset-x-0 bg-white border-t border-[#E5E7EB] z-30">
  <div class="max-w-3xl mx-auto px-4 py-3">
    <div id="att" class="hidden mb-2 text-xs"><span class="badge bg-gray-100 text-gray-700" id="att-name"></span> <button id="att-x" class="text-[#DC2626] font-bold ml-1">× rimuovi</button></div>
    <div class="flex items-end gap-2">
      <button id="btn-att" class="btn-outline !px-3" title="Allega foto, PDF, TXT o CSV (es. ordine fornitore)">📎</button>
      <input type="file" id="file" class="hidden" accept="image/*,.pdf,.txt,.csv,.tsv,.md" />
      <textarea id="msg" rows="1" placeholder="Es. «Inserisci iPhone 13 128 GB nero, usato ottimo, 380 euro»" class="resize-none max-h-40"></textarea>
      <button id="send" class="btn-primary">Invia</button>
    </div>
  </div>
</div>
<div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-[#0B0F19] text-white text-sm font-medium px-4 py-2.5 rounded-full"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let REQS = [];
let FILE = null;
let busyIds = new Set();

function toast(m, ok = true) {
  const t = $('#toast'); t.textContent = m; t.style.background = ok ? '#0B0F19' : '#B91C1C';
  t.classList.remove('hidden'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), 3000);
}
const fmtTime = (iso) => new Date(iso).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
function dayLabel(iso) {
  const d = new Date(iso), t = new Date();
  const k = (x) => x.toDateString();
  const y = new Date(t); y.setDate(t.getDate() - 1);
  if (k(d) === k(t)) return 'Oggi';
  if (k(d) === k(y)) return 'Ieri';
  return d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
}
const STATUS = {
  queued: ['In coda', 'bg-amber-100 text-amber-700'], processing: ['Elaboro…', 'bg-blue-100 text-blue-700'],
  awaiting_confirm: ['Da confermare', 'bg-amber-100 text-amber-800'], done: ['Completata', 'bg-emerald-100 text-emerald-700'],
  cancelled: ['Annullata', 'bg-gray-200 text-gray-600'], error: ['Errore', 'bg-red-100 text-red-700'],
};

function actionHtml(a, i, r) {
  const cls = a.danger ? 'danger' : !a.valid ? 'invalid' : '';
  const icon = { add_item: '➕', update_item: '✏️', mark_sold: '🏷️', mark_unsold: '↩️', delete_item: '🗑️', search: '🔎' }[a.type] || '•';
  const editable = r.status === 'awaiting_confirm' && a.valid && a.editablePrice;
  return `<div class="summary ${cls} p-3 text-sm">
    <p class="font-semibold">${icon} ${esc(a.title)} ${a.done === true ? '<span class="badge bg-emerald-100 text-emerald-700">eseguita</span>' : ''}${a.valid ? '' : '<span class="badge bg-orange-100 text-orange-700 ml-1">non eseguibile</span>'}</p>
    ${a.lines.map((l) => `<p class="text-gray-700 mt-0.5">${esc(l)}</p>`).join('')}
    ${(a.warnings || []).map((w) => `<p class="text-orange-700 mt-0.5">⚠ ${esc(w)}</p>`).join('')}
    ${a.errors.map((e) => `<p class="text-red-700 mt-0.5">✗ ${esc(e)}</p>`).join('')}
    ${editable ? `<div class="mt-2 flex items-center gap-2"><label class="text-xs font-semibold text-gray-600 shrink-0">Prezzo € (modificabile)</label><input type="number" min="0" step="1" class="!w-28 !py-1 price-ov" data-i="${i}" value="${a.fields.price ?? ''}" placeholder="su richiesta"></div>` : ''}
  </div>`;
}

function reqHtml(r) {
  const [stLabel, stCls] = STATUS[r.status] || [r.status, 'bg-gray-100'];
  const att = r.attachment ? `<p class="text-xs opacity-80 mt-1">📎 ${esc(r.attachment.name)}</p>` : '';
  let bot = '';
  if (r.status === 'queued' || r.status === 'processing') {
    bot = `<p class="text-sm text-gray-600"><span class="dots"><span></span><span></span><span></span></span> ${esc(r.note || (r.status === 'processing' ? 'Sto elaborando la richiesta…' : 'Richiesta in coda.'))}</p>
      <div class="mt-2"><button class="btn-outline text-xs !py-1" data-act="cancel" data-id="${r.id}">Annulla</button></div>`;
  } else if (r.status === 'error') {
    bot = `<p class="text-sm text-red-700">✗ ${esc(r.error)}</p><div class="mt-2 flex gap-2"><button class="btn-outline text-xs !py-1" data-act="retry" data-id="${r.id}">Riprova</button><button class="btn-outline text-xs !py-1" data-act="cancel" data-id="${r.id}">Annulla</button></div>`;
  } else {
    bot = `<p class="text-sm whitespace-pre-wrap">${esc(r.reply)}</p>`;
    if (r.actions?.length) bot += `<div class="mt-3 space-y-2">${r.actions.map((a, i) => actionHtml(a, i, r)).join('')}</div>`;
    if (r.status === 'awaiting_confirm') {
      const n = r.actions.filter((a) => !a.readOnly && a.valid).length;
      const danger = r.actions.some((a) => a.danger && a.valid);
      bot += `<div class="mt-3 p-3 rounded-lg bg-amber-50 border border-amber-200 text-sm"><p class="font-semibold mb-2">Controlla il riepilogo: ${n} ${n === 1 ? 'operazione verrà eseguita' : 'operazioni verranno eseguite'} solo dopo la tua conferma.</p>
        <div class="flex gap-2"><button class="${danger ? 'btn-danger' : 'btn-primary'} text-sm" data-act="confirm" data-id="${r.id}">${danger ? '⚠ Conferma ed elimina' : '✓ Conferma ed esegui'}</button><button class="btn-outline text-sm" data-act="cancel" data-id="${r.id}">Annulla</button></div></div>`;
    }
    if (r.executionLog?.length) bot += `<div class="mt-3 text-sm space-y-0.5">${r.executionLog.map((l) => `<p class="${l.startsWith('✗') || l.startsWith('⚠') ? 'text-red-700' : 'text-emerald-700'}">${esc(l)}</p>`).join('')}</div>`;
    if (r.suggestions?.length) bot += `<div class="mt-3"><p class="text-xs font-semibold text-gray-500 mb-1">💡 Suggerimenti</p><div class="flex flex-wrap gap-2">${r.suggestions.map((s) => `<button class="btn-outline text-xs !py-1 !px-2.5 !whitespace-normal text-left" data-sug="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;
  }
  return `<div>
    <div class="flex justify-end"><div class="bubble-user px-4 py-2.5 max-w-[85%] text-sm"><p class="whitespace-pre-wrap">${esc(r.text) || '<i>(solo allegato)</i>'}</p>${att}<p class="text-[10px] opacity-60 mt-1 text-right">${fmtTime(r.createdAt)}</p></div></div>
    <div class="flex mt-2"><div class="bubble-bot px-4 py-3 max-w-[92%] w-full sm:w-auto sm:min-w-[60%]">
      <div class="flex items-center gap-2 mb-1.5"><span class="badge ${stCls}">${stLabel}</span>${r.durationMs ? `<span class="text-[10px] text-gray-400">${Math.round(r.durationMs / 1000)}s · ${esc(r.model)}</span>` : ''}</div>${bot}</div></div></div>`;
}

function visible() {
  const f = $('#flt').value;
  return REQS.filter((r) => f === 'all' || (f === 'executed' && r.executed) || (f === 'cancelled' && r.status === 'cancelled') || (f === 'pending' && ['queued', 'processing', 'awaiting_confirm'].includes(r.status)));
}

function render() {
  const list = visible();
  $('#empty').classList.toggle('hidden', REQS.length > 0);
  let last = '', html = '';
  for (const r of list) {
    const d = dayLabel(r.createdAt);
    if (d !== last) { html += `<p class="text-center text-xs font-semibold text-gray-400 uppercase tracking-wide pt-2">${esc(d)}</p>`; last = d; }
    html += reqHtml(r);
  }
  const active = document.activeElement?.classList?.contains('price-ov') ? document.activeElement : null;
  if (active) { load.prev = null; return; } // non ridisegnare mentre si modifica un prezzo
  $('#feed').innerHTML = html;
  $('#hist-note').textContent = REQS.length ? `${REQS.length} richieste · cronologia conservata ${window.RET || 30} giorni` : '';
}

async function load(scroll) {
  try {
    const res = await fetch('/api/assistant/requests');
    REQS = (await res.json()).requests;
    const before = JSON.stringify(REQS);
    if (load.prev !== before) { load.prev = before; render(); if (scroll) window.scrollTo(0, document.body.scrollHeight); }
  } catch {}
}
async function status() {
  try {
    const s = await (await fetch('/api/assistant/status')).json();
    window.RET = s.retentionDays;
    const el = $('#status-line');
    if (!s.ollama) el.innerHTML = '🔴 LLM spento: le richieste restano in coda' + (s.queued ? ` (${s.queued})` : '');
    else if (!s.textModelOk) el.innerHTML = `🟠 Modello ${esc(s.textModel)} non trovato in Ollama`;
    else el.innerHTML = `🟢 LLM pronto · ${esc(s.textModel)}` + (s.queued ? ` · ${s.queued} in coda` : '');
  } catch { $('#status-line').textContent = 'Server non raggiungibile'; }
}

async function send(text) {
  text = (text ?? $('#msg').value).trim();
  if (!text && !FILE) return;
  const fd = new FormData();
  fd.append('text', text);
  if (FILE) fd.append('file', FILE);
  $('#send').disabled = true;
  try {
    const res = await fetch('/api/assistant/message', { method: 'POST', body: fd });
    const j = await res.json();
    if (!j.ok) return toast(j.error || 'Errore', false);
    $('#msg').value = ''; $('#msg').style.height = ''; FILE = null; $('#att').classList.add('hidden'); $('#file').value = '';
    load.prev = null; await load(true);
  } finally { $('#send').disabled = false; }
}

$('#send').onclick = () => send();
$('#msg').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('#msg').addEventListener('input', (e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; });
$('#btn-att').onclick = () => $('#file').click();
$('#file').onchange = (e) => { FILE = e.target.files[0] || null; if (FILE) { $('#att-name').textContent = '📎 ' + FILE.name; $('#att').classList.remove('hidden'); } };
$('#att-x').onclick = () => { FILE = null; $('#file').value = ''; $('#att').classList.add('hidden'); };
$('#flt').onchange = render;

$('#feed').addEventListener('click', async (e) => {
  const sug = e.target.closest('[data-sug]');
  if (sug) { $('#msg').value = sug.dataset.sug; $('#msg').focus(); return; }
  const b = e.target.closest('[data-act]');
  if (!b || busyIds.has(b.dataset.id)) return;
  const id = b.dataset.id;
  busyIds.add(id);
  try {
    let body;
    if (b.dataset.act === 'confirm') {
      const overrides = {};
      b.closest('.bubble-bot').querySelectorAll('.price-ov').forEach((inp) => { overrides[inp.dataset.i] = { price: inp.value }; });
      body = { overrides };
    }
    const res = await fetch(`/api/assistant/requests/${id}/${b.dataset.act}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    const j = await res.json();
    if (!j.ok) toast(j.error || 'Errore', false);
    else toast(b.dataset.act === 'confirm' ? 'Operazione eseguita.' : b.dataset.act === 'cancel' ? 'Annullata.' : 'Rimessa in coda.');
  } finally { busyIds.delete(id); load.prev = null; load(); }
});

['Mostrami cosa c\'è in vetrina', 'Quali articoli sono fermi da più tempo?', 'Aiutami a scrivere la descrizione di un iPhone usato', 'Inserisci iPhone 13 128 GB nero usato ottimo, 380 euro'].forEach((t) => {
  const b = document.createElement('button'); b.className = 'btn-outline text-xs !py-1.5'; b.textContent = t; b.onclick = () => send(t); $('#examples').appendChild(b);
});

status(); load(true);
setInterval(() => load(), 2500);
setInterval(status, 10000);
</script>
</body>
</html>
